name: Build Family Location v2.2.11 Samsung survival candidate
on:
  pull_request:
    branches: [v2210-always-active-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Worker auth/retry/runtime and Firestore rules regression
        working-directory: cloudflare-wake
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          npm run dry-run
          npm run test:runtime
          node render-rules.mjs --parent-uid test-parent --child-uid test-child --output .wrangler/test-fixture.rules
          npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-family-location-wake --config firebase-test.json 'node test/firestore-rules.mjs'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct audited v2210 and append v2211
        run: python3 -X utf8 scripts/reconstruct.py
      - name: Static product/secret boundary and recovery validation
        run: python3 -X utf8 scripts/validate.py
      - name: Core, journal/token, Android build and full lint
        working-directory: appsrc
        run: gradle :core:coreSelfCheck :core:scenarioCheck :child-app:testDebugUnitTest :parent-app:assembleRelease :child-app:assembleRelease :parent-app:lintRelease :child-app:lintRelease --console=plain --stacktrace
      - name: Collect unsigned and unconfigured candidate
        run: |
          mkdir -p out/cloudflare-wake
          cp appsrc/parent-app/build/outputs/apk/release/parent-app-release-unsigned.apk out/Family-Parent-v2.2.11-unsigned.apk
          cp appsrc/child-app/build/outputs/apk/release/child-app-release-unsigned.apk out/Family-Child-v2.2.11-unsigned.apk
          cp -r cloudflare-wake/src cloudflare-wake/test out/cloudflare-wake/
          cp cloudflare-wake/package*.json cloudflare-wake/wrangler.jsonc cloudflare-wake/firebase-test.json cloudflare-wake/render-rules.mjs out/cloudflare-wake/
          cp -r docs scripts out/
          git archive --format=zip --output=out/Family-Location-v2.2.11-Source.zip HEAD
          sha256sum out/*.apk out/*Source.zip > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: family-location-v2.2.11-unsigned-unconfigured-candidate
          path: out/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-location-v2.2.11-test-reports
          path: |
            appsrc/child-app/build/reports/tests/
            appsrc/child-app/build/reports/lint-results-release.*
            appsrc/parent-app/build/reports/lint-results-release.*
