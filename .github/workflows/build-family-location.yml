name: Build Family Location APKs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore project source
        shell: bash
        run: |
          cat apk-build/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip -d appsrc
          test -f appsrc/settings.gradle.kts
          test -f appsrc/parent-app/google-services.json
          test -f appsrc/child-app/google-services.json
          sed -i 's/compileSdk = 37/compileSdk = 36/g' appsrc/parent-app/build.gradle.kts appsrc/child-app/build.gradle.kts
      - name: Unit tests
        working-directory: appsrc
        run: gradle :core:test --stacktrace
      - name: Build Parent and Child debug APKs
        working-directory: appsrc
        run: gradle :parent-app:assembleDebug :child-app:assembleDebug --stacktrace
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          cp appsrc/parent-app/build/outputs/apk/debug/parent-app-debug.apk out/Family-Parent-v1.2.apk
          cp appsrc/child-app/build/outputs/apk/debug/child-app-debug.apk out/Family-Child-v1.2.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: family-location-apks
          path: out/*
          if-no-files-found: error
          retention-days: 14
