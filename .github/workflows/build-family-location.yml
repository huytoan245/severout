name: Build Family Location APKs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore and migrate project source
        shell: bash
        run: |
          cat apk-build/part*.txt > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip -d appsrc
          test -f appsrc/settings.gradle.kts
          test -f appsrc/parent-app/google-services.json
          test -f appsrc/child-app/google-services.json
          sed -i 's/compileSdk = 37/compileSdk = 36/g' appsrc/parent-app/build.gradle.kts appsrc/child-app/build.gradle.kts
          sed -i 's/compose-bom:2026.08.00/compose-bom:2026.06.00/g' appsrc/parent-app/build.gradle.kts appsrc/child-app/build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/d' appsrc/parent-app/build.gradle.kts appsrc/child-app/build.gradle.kts
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' appsrc/parent-app/build.gradle.kts appsrc/child-app/build.gradle.kts
          cp ci-patches/ChildMainActivity.kt appsrc/child-app/src/main/java/com/family/child/MainActivity.kt
          cp ci-patches/LocationService.kt appsrc/child-app/src/main/java/com/family/child/LocationService.kt
          cp ci-patches/ParentMainActivity.kt appsrc/parent-app/src/main/java/com/family/parent/MainActivity.kt
          cat >> appsrc/core/build.gradle.kts <<'EOF'

          tasks.register<JavaExec>("coreSelfCheck") {
              group = "verification"
              classpath = sourceSets["test"].runtimeClasspath
              mainClass.set("com.family.core.CoreSelfTestKt")
              dependsOn("testClasses")
          }
          tasks.register<JavaExec>("scenarioCheck") {
              group = "verification"
              classpath = sourceSets["test"].runtimeClasspath
              mainClass.set("com.family.core.ScenarioTestKt")
              dependsOn("testClasses")
          }
          EOF
      - name: Core logic checks
        working-directory: appsrc
        run: gradle :core:coreSelfCheck :core:scenarioCheck --stacktrace
      - name: Build Parent and Child debug APKs
        working-directory: appsrc
        run: gradle :parent-app:assembleDebug :child-app:assembleDebug --stacktrace
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          cp appsrc/parent-app/build/outputs/apk/debug/parent-app-debug.apk out/Family-Parent-v1.5.apk
          cp appsrc/child-app/build/outputs/apk/debug/child-app-debug.apk out/Family-Child-v1.5.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: family-location-apks-v1.5
          path: out/*
          if-no-files-found: error
          retention-days: 14
